camera:
  index: 0                    # RealSense 컬러를 못 찾을 때 쓰는 기본 카메라 (미로는 camera_select 가 자동으로 찾음)
  width: 1280                 # [실기] 1280x720: 테이블 위 1px ≈ 1mm, 카메라-로봇 보정과 같은 해상도
  height: 720
  crop: null
vision:
  card_min_confidence: 0.55
  maze_threshold: 170
  maze_clearance_px: 3
  maze_step_px: 8
  # [실기] 보드 모서리로 쓰는 ArUco 마커 id (카메라 화면 기준 TL, TR, BR, BL). 로봇 좌표는 2026-11-10 펜 끝으로 실측
  board_marker_ids: [1, 3, 2, 0]
  holder_marker_id: 25        # [실기] 펜 거치대(컵) 옆 마커. robot_games.pen_holder 가 이 마커로 거치대 위치를 찾음
robot:
  namespace: dsr01
  model: e0509
  mode: mock
  # All real motion disabled unless explicitly armed, AND calibrated.
  armed: true                 # [실기] 2026-11-10 현장 준비·보정 확인 후 켬
  calibration_confirmed: true
  home_joints_deg: [-0.375, 2.062, 98.499, -0.003, 79.451, -0.376]   # [실기] 교시값 (종이 위 대기 자세)
  operation_speed_pct: 100    # [실기] 컨트롤러 속도 배율. DART 에서 10% 로 남아 있어 모든 동작이 10배 느렸음
  min_pen_z_base_mm: 30.0     # [실기] 펜 끝(pen_tip) Z 하한. 테이블 면 약 35~39mm (2026-11-14 거치대 펜 기준, 이전 40)
  pen_from_holder: true       # [실기] 게임 앞뒤로 거치대에서 펜 부품을 집고 반납 (app.py → robot_games.pen_holder). false 면 미리 물린 펜
  celebration_joints_deg: [-0.432, -6.55, 99.035, -0.003, 87.527, -0.433]   # [실기] 교시값 (configs/field/robot_poses.json)
  # Plane coordinate calibration, measured on-site (not example coordinates).
  board_origin_base_mm: null
  board_x_axis_base_mm: null
  board_y_axis_base_mm: null
  drawing_z_base_mm: null
  safe_z_base_mm: null
  tool_rpy_deg: null
  max_path_points: 1500
  max_board_side_mm: 300
  speed_mm_s: 50              # [실기] 그리기 속도 (상한 60). 펜 내린 구간은 movesx 로 멈추지 않고 이어서
  accel_mm_s2: 200
  jog_speed_mm_s: 250         # [실기] robot_games.calibrate --jog 위치 맞추기·공중 이동 (상한 300)
  jog_accel_mm_s2: 600
  joint_speed_deg_s: 10
  joint_accel_deg_s2: 20
gripper:
  enabled: false
  port: /dev/ttyUSB0
  baud: 57600                 # [실기] 2026-11-10 플랜지 시리얼로 닫기(620) 동작 확인
  id: 1
  # [실기] 아래는 robot_games/calib/gripper.py(두산 플랜지 시리얼, robot_games.calib.calibrate gripper) 용.
  # RH-P12-RN(A): Modbus RTU, 슬레이브 ID 1. 레지스터는 0부터 세는 번호(4xxxx - 40001)
  backend: flange
  protocol: modbus
  registers:
    torque_enable: 256        # 40257
    goal_current: 275         # 40276
    goal_position: 282        # 40283 (FC16 2레지스터 [값, 0])
    present_position: 290     # [실기] 2026-11-11 읽기로 확인 (목표 위치와 같은 값이 나옴)
    profile_acceleration: 278 # 40279 (FC16 2레지스터). 켜질 때 3447(최대)
    profile_velocity: 280     # 40281 (FC16 2레지스터). 켜질 때 2970(최대)
  goal_current: 400
  profile_acceleration: 600   # [실기] 잡고 놓을 때 진동 줄이기 (최대의 약 20%). 클수록 빠름
  profile_velocity: 600
  motion_timeout_s: 6.0       # 열기·닫기 후 위치 확인을 기다리는 최대 시간
  open_position: 0
  closed_position: 620
  holding_min: 450            # [실기] 회색 펜 부품을 물면 520~580 (2026-11-11 읽음). 이 범위 밖이면 못 잡은 것
  holding_max: 605            #        빈 손으로 닫으면 620 근처까지 감
  settle_s: 0.8
  drl_timeout_s: 10
  readback_host: 110.120.1.3  # [실기] 컨트롤러에서 보이는 이 PC 의 IP (위치 읽기·열림/파지 확인용). PC 를 바꾸면 수정
  readback_port: 20002
